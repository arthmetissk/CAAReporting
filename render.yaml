services:
  - type: web
    name: caa-campaign-intelligence
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/healthcheck
    envVars:
      - key: APP_USERNAME
        value: caa
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        value: caa-campaign-secret-key
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: claude-3-5-sonnet-20241022
