<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAA Campaign Intelligence Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-body">
  <section class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark large">CAA</span>
        <div>
          <div class="brand-title">Campaign Intelligence</div>
          <div class="brand-subtitle">August 2026</div>
        </div>
      </div>

      <div class="login-panel">
        <div class="login-title">Executive Report Access</div>
        {% if error %}
          <div class="login-error">{{ error }}</div>
        {% endif %}
        <form class="login-form" method="post">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" id="username" name="username" type="text" value="caa" required>

          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" name="password" type="password" required autocomplete="current-password">

          <button class="primary-button" type="submit">Sign In</button>
        </form>
      </div>
    </div>
  </section>
</body>
</html>
